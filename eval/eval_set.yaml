# Eval set untuk bot tanya-jawab kebijakan HRD.
#
# CARA PAKAI: ini baru KERANGKA berisi 36 kasus berdasarkan dokumen contoh.
# Sebelum rilis, HRD harus:
#   1. mengganti pertanyaannya dengan pertanyaan NYATA dari log mereka
#      (minta ekspor 200 tiket/chat terakhir, ambil yang paling sering)
#   2. mengisi jawaban benar & sumbernya sendiri
#   3. menambah sampai minimal 50 kasus, dengan porsi kasus 'tolak' >= 15%
#
# tipe:
#   jawab            -> bot harus menjawab, mengutip dokumen yang benar
#   tolak            -> pagar pengaman harus memblokir, dengan kategori tertentu
#   tidak_ditemukan  -> tidak ada di dokumen, bot harus mengaku tidak tahu
#
# kata_kunci dicocokkan apa adanya (case-insensitive) di dalam jawaban.
# Pakai frasa pendek yang pasti muncul, jangan kalimat panjang.

