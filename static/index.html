<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten HRD</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --tx: #1b1d22; --tx-dim: #6b7280;
    --line: #e3e5ea; --me: #1f6feb; --me-tx: #ffffff; --bot: #eef0f4;
    --warn-bg: #fff7e6; --warn-line: #f0c36d; --warn-tx: #6b4c07;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --card: #1c1f25; --tx: #e8eaed; --tx-dim: #9aa2ad;
      --line: #2c3037; --bot: #262a31;
      --warn-bg: #2e2510; --warn-line: #6b5518; --warn-tx: #f0d493;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 720px; padding: 16px; display: flex; flex-direction: column; }
  header { padding: 8px 0 14px; }
  h1 { font-size: 19px; margin: 0 0 3px; }
  .sub { color: var(--tx-dim); font-size: 13px; }
  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  label { font-size: 12px; color: var(--tx-dim); }
  select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx);
  }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
  .msg { display: flex; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    background: var(--bot); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--me); color: var(--me-tx); border-bottom-right-radius: 5px; }
  .bot .bubble { border-bottom-left-radius: 5px; }
  .meta { font-size: 11.5px; color: var(--tx-dim); margin-top: 7px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--line); margin: 3px 4px 0 0;
  }
  .disclaimer {
    font-size: 11.5px; background: var(--warn-bg); border: 1px solid var(--warn-line);
    color: var(--warn-tx); padding: 7px 10px; border-radius: 9px; margin-top: 8px;
  }
  form { display: flex; gap: 8px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
  input[type=text] {
    flex: 1; font: inherit; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx);
  }
  button {
    font: inherit; font-weight: 600; padding: 11px 18px; border: 0; border-radius: 10px;
    background: var(--me); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--tx-dim); font-size: 12px; padding-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Asisten HRD</h1>
    <div class="sub">Tanya apa saja soal kebijakan kepegawaian. Tidak perlu sungkan.</div>
  </header>

  <div class="bar">
    <label for="status">Status kerja kamu (opsional)</label>
    <select id="status">
      <option value="tidak_diketahui">Tidak disebutkan</option>
      <option value="tetap">Karyawan tetap</option>
      <option value="pkwt">PKWT / kontrak</option>
      <option value="harian">Harian</option>
      <option value="outsourcing">Outsourcing</option>
      <option value="magang">Magang</option>
    </select>
  </div>

  <div id="log"></div>

  <form id="f">
    <input id="q" type="text" autocomplete="off"
           placeholder="Contoh: cuti tahunan berapa hari?" required>
    <button id="send" type="submit">Kirim</button>
  </form>
  <div class="hint">Jangan kirim data pribadi seperti NIK atau nomor rekening di sini.</div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');
const statusSel = document.getElementById('status');

// Session id per-tab. Disimpan di sessionStorage supaya refresh tidak
// kehilangan konteks, tapi tab lain punya percakapan sendiri.
let sid;
try {
  sid = sessionStorage.getItem('sid');
  if (!sid) { sid = 'web-' + crypto.randomUUID(); sessionStorage.setItem('sid', sid); }
} catch (e) { sid = 'web-' + Math.random().toString(36).slice(2, 14); }

function bubble(who, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  log.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight);
  return b;
}

function tambahMeta(b, data) {
  if (data.sumber && data.sumber.length) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = 'Sumber: ';
    data.sumber.forEach(s => {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = s;
      m.appendChild(t);
    });
    b.appendChild(m);
  }
  if (data.disclaimer) {
    const d = document.createElement('div');
    d.className = 'disclaimer';
    d.textContent = data.disclaimer;
    b.appendChild(d);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pesan = input.value.trim();
  if (!pesan) return;
  bubble('me', pesan);
  input.value = '';
  send.disabled = true;
  const pending = bubble('bot', 'Sedang mencari di dokumen kebijakan…');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sid, pesan, status_kerja: statusSel.value, channel: 'web'
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    pending.textContent = data.pesan;
    tambahMeta(pending, data);
  } catch (err) {
    pending.textContent =
      'Maaf, koneksi ke server gagal. Coba lagi sebentar, atau hubungi HRD langsung.';
  } finally {
    send.disabled = false;
    input.focus();
  }
});

bubble('bot',
  'Hai! Aku bisa membantu menjawab soal cuti, absensi, BPJS, fasilitas kantor, ' +
  'dan prosedur kepegawaian lainnya.\n\nUntuk hal yang menyangkut kasus pribadimu ' +
  '— sanksi, PHK, konflik kerja — aku akan langsung menghubungkanmu ke HRD.');
</script>
</body>
</html>
