<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten HRD</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --tx: #1b1d22; --tx-dim: #6b7280;
    --line: #e3e5ea; --me: #1f6feb; --me-tx: #ffffff; --bot: #eef0f4;
    --warn-bg: #fff7e6; --warn-line: #f0c36d; --warn-tx: #6b4c07;
    --esc-bg: #fdeceb; --esc-line: #f0b3ad; --esc-tx: #8a1c12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --card: #1c1f25; --tx: #e8eaed; --tx-dim: #9aa2ad;
      --line: #2c3037; --bot: #262a31;
      --warn-bg: #2e2510; --warn-line: #6b5518; --warn-tx: #f0d493;
      --esc-bg: #331916; --esc-line: #6b2a24; --esc-tx: #f3a79d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 720px; padding: 16px; display: flex; flex-direction: column; }
  header { padding: 8px 0 14px; }
  h1 { font-size: 19px; margin: 0 0 3px; }
  .sub { color: var(--tx-dim); font-size: 13px; }
  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  label { font-size: 12px; color: var(--tx-dim); }
  select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx);
  }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
  .msg { display: flex; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    background: var(--bot); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--me); color: var(--me-tx); border-bottom-right-radius: 5px; }
  .bot .bubble { border-bottom-left-radius: 5px; }
  .meta { font-size: 11.5px; color: var(--tx-dim); margin-top: 7px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--line); margin: 3px 4px 0 0;
  }
  .status {
    display: block; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px; margin-top: 9px;
    width: max-content; max-width: 100%;
  }
  .status.tahan { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-tx); }
  .status.esk { background: var(--esc-bg); border: 1px solid var(--esc-line); color: var(--esc-tx); }
  .disclaimer {
    font-size: 11.5px; background: var(--warn-bg); border: 1px solid var(--warn-line);
    color: var(--warn-tx); padding: 7px 10px; border-radius: 9px; margin-top: 8px;
  }
  form { display: flex; gap: 8px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
  input[type=text] {
    flex: 1; font: inherit; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx);
  }
  button {
    font: inherit; font-weight: 600; padding: 11px 18px; border: 0; border-radius: 10px;
    background: var(--me); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--tx-dim); font-size: 12px; padding-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Asisten HRD</h1>
    <div class="sub">Tanya apa saja soal kebijakan kepegawaian. Tidak perlu sungkan.</div>
  </header>

  <div class="bar">
    <label for="status">Status kerja kamu (opsional)</label>
    <select id="status">
      <option value="tidak_diketahui">Tidak disebutkan</option>
      <option value="tetap">Karyawan tetap</option>
      <option value="pkwt">PKWT / kontrak</option>
      <option value="harian">Harian</option>
      <option value="outsourcing">Outsourcing</option>
      <option value="magang">Magang</option>
    </select>
  </div>

  <div id="log"></div>

  <form id="f">
    <input id="q" type="text" autocomplete="off"
           placeholder="Contoh: cuti tahunan berapa hari?" required>
    <button id="send" type="submit">Kirim</button>
  </form>
  <div class="hint">Jangan kirim data pribadi seperti NIK atau nomor rekening di sini.</div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');
const statusSel = document.getElementById('status');

// Session id per-tab. Disimpan di sessionStorage supaya refresh tidak
// kehilangan konteks, tapi tab lain punya percakapan sendiri.
let sid;
try {
  sid = sessionStorage.getItem('sid');
  if (!sid) { sid = 'web-' + crypto.randomUUID(); sessionStorage.setItem('sid', sid); }
} catch (e) { sid = 'web-' + Math.random().toString(36).slice(2, 14); }

function bubble(who, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  log.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight);
  return b;
}

// Apa yang terjadi pada pertanyaan ini. Teks jawabannya sudah menjelaskan,
// tapi penanda visual membuat karyawan langsung tahu ini belum jawaban final
// dan tidak perlu menunggu di depan layar.
const STATUS = {
  ditahan_draf: { kelas: 'tahan', teks: 'Menunggu ditinjau HRD' },
  dieskalasi:   { kelas: 'esk',   teks: 'Diteruskan ke HRD' },
};

function tambahMeta(b, data) {
  const st = STATUS[data.hasil];
  if (st) {
    const s = document.createElement('div');
    s.className = 'status ' + st.kelas;
    s.textContent = st.teks;
    b.appendChild(s);
  }
  if (data.sumber && data.sumber.length) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = 'Sumber: ';
    data.sumber.forEach(s => {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = s;
      m.appendChild(t);
    });
    b.appendChild(m);
  }
  if (data.disclaimer) {
    const d = document.createElement('div');
    d.className = 'disclaimer';
    d.textContent = data.disclaimer;
    b.appendChild(d);
  }
}

// Menonaktifkan tombol saja tidak cukup: menekan Enter di kolom teks tetap
// mengirim form, jadi satu pertanyaan bisa terkirim berkali-kali sebelum yang
// pertama selesai. Penjaganya harus di handler, bukan di tombol.
// Riwayat percakapan disimpan di sessionStorage, bukan ditarik ulang dari server.
// Alasannya: session_id sendiri hidup di sessionStorage. Kalau penyimpanan itu
// hilang, id-nya ikut hilang dan riwayat di server tidak bisa dijangkau lagi —
// jadi endpoint riwayat tidak menambah daya tahan apa pun, hanya menambah satu
// jalur tanpa autentikasi yang menyajikan isi percakapan orang. Umur simpannya
// sama persis, risikonya tidak.
const KUNCI_RIWAYAT = 'riwayat';
const MAKS_RIWAYAT = 40;

let riwayat = [];
try {
  riwayat = JSON.parse(sessionStorage.getItem(KUNCI_RIWAYAT) || '[]');
  if (!Array.isArray(riwayat)) riwayat = [];
} catch (e) { riwayat = []; }

function catat(who, text, data) {
  riwayat.push(data ? { who, text, data } : { who, text });
  if (riwayat.length > MAKS_RIWAYAT) riwayat = riwayat.slice(-MAKS_RIWAYAT);
  try {
    sessionStorage.setItem(KUNCI_RIWAYAT, JSON.stringify(riwayat));
  } catch (e) {
    // Kuota penuh, mode penyamaran, atau storage diblokir. Percakapan tetap
    // jalan, cuma tidak bertahan saat refresh — ini tidak boleh menggagalkan
    // pengiriman pertanyaan.
  }
}

// Satu pintu untuk menampilkan jawaban: isi balon, tempel meta, lalu catat.
// Supaya jalur sukses dan jalur galat tidak bisa lupa menyimpan.
function jawab(b, text, data) {
  b.textContent = text;
  if (data) tambahMeta(b, data);
  catat('bot', text, data);
}

// Menonaktifkan tombol saja tidak cukup: menekan Enter di kolom teks tetap
// mengirim form, jadi satu pertanyaan bisa terkirim berkali-kali sebelum yang
// pertama selesai. Penjaganya harus di handler, bukan di tombol.
let sibuk = false;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (sibuk) return;
  const pesan = input.value.trim();
  if (!pesan) return;
  sibuk = true;
  bubble('me', pesan);
  catat('me', pesan);
  input.value = '';
  send.disabled = true;
  const pending = bubble('bot', 'Sedang mencari di dokumen kebijakan…');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sid, pesan, status_kerja: statusSel.value, channel: 'web'
      })
    });
    // Server yang menjawab dengan galat bukan hal yang sama dengan server yang
    // tidak terjangkau — pesannya jangan diseragamkan jadi "koneksi gagal".
    if (r.status === 422) {
      jawab(pending, 'Pertanyaannya terlalu panjang atau kosong. '
        + 'Coba tulis ulang lebih pendek.');
      return;
    }
    if (!r.ok) {
      jawab(pending, 'Layanannya sedang bermasalah dan sudah tercatat di tim teknis. '
        + 'Untuk yang mendesak, hubungi HRD langsung.');
      return;
    }
    const data = await r.json();
    jawab(pending, data.pesan, {
      hasil: data.hasil, sumber: data.sumber, disclaimer: data.disclaimer,
    });
  } catch (err) {
    jawab(pending, 'Maaf, koneksi ke server gagal. '
      + 'Coba lagi sebentar, atau hubungi HRD langsung.');
  } finally {
    sibuk = false;
    send.disabled = false;
    input.focus();
  }
});

bubble('bot',
  'Hai! Aku bisa membantu menjawab soal cuti, absensi, BPJS, fasilitas kantor, ' +
  'dan prosedur kepegawaian lainnya.\n\nUntuk hal yang menyangkut kasus pribadimu ' +
  '— sanksi, PHK, konflik kerja — aku akan langsung menghubungkanmu ke HRD.');

// Tampilkan lagi percakapan sebelumnya. Tanpa ini, refresh terlihat seperti
// kehilangan konteks padahal server masih mengingatnya, dan karyawan mengulang
// pertanyaan yang sama.
riwayat.forEach(r => {
  const b = bubble(r.who, r.text);
  if (r.data) tambahMeta(b, r.data);
});
</script>
</body>
</html>
