<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konsol HRD</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --tx:#1b1d22; --dim:#6b7280; --line:#e3e5ea;
    --ok:#1a7f37; --no:#b42318; --pri:#1f6feb; --code:#f2f3f6;
    --k:#fde8e6; --k-tx:#8a1c12; --t:#fff4e5; --t-tx:#7a4a06; --n:#eef0f4; --n-tx:#44484f;
    --ok-bg:#e7f6ec; --ok-tx:#14682d; --f-kritis:#b42318; --f-tinggi:#b7791f;
    --f-normal:#8b919c; --f-ok:#1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14161a; --card:#1c1f25; --tx:#e8eaed; --dim:#9aa2ad; --line:#2c3037;
      --code:#24272e; --k:#3a1714; --k-tx:#f5a99f; --t:#332507; --t-tx:#f0c987;
      --n:#262a31; --n-tx:#c2c7ce;
      --ok-bg:#15301e; --ok-tx:#6ed58c; --f-kritis:#e8675a; --f-tinggi:#dda93a;
      --f-normal:#79808c; --f-ok:#3fae63;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:18px}
  input,textarea,button{font:inherit}
  input[type=password],input[type=text]{padding:8px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg);color:var(--tx)}
  button{padding:8px 15px;border:0;border-radius:8px;background:var(--pri);color:#fff;
    font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
  button.ok{background:var(--ok)} button.no{background:var(--no)}
  button:disabled{opacity:.5;cursor:default}
  nav{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  nav button{background:transparent;color:var(--dim);border-radius:0;
    border-bottom:2px solid transparent;font-weight:500;padding:9px 13px}
  nav button.on{color:var(--tx);border-bottom-color:var(--pri);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:15px;margin-bottom:13px}
  .q{font-weight:600;margin-bottom:9px}
  .a{background:var(--code);border-radius:9px;padding:11px;white-space:pre-wrap;
    overflow-wrap:anywhere;font-size:14px}
  textarea{width:100%;min-height:110px;padding:11px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--tx);
    white-space:pre-wrap;resize:vertical;margin-top:9px}
  .row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .meta{font-size:12px;color:var(--dim);margin-top:8px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;
    border-radius:20px;margin-right:5px}
  .pill.kritis{background:var(--k);color:var(--k-tx)}
  .pill.tinggi{background:var(--t);color:var(--t-tx)}
  .pill.normal{background:var(--n);color:var(--n-tx)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px}
  .kpi .n{font-size:25px;font-weight:700} .kpi .l{font-size:12px;color:var(--dim)}
  .empty{color:var(--dim);padding:26px;text-align:center}
  pre{background:var(--code);padding:12px;border-radius:9px;overflow:auto;font-size:12.5px}
  .kpi .h{font-size:11.5px;color:var(--dim);margin-top:4px}
  .sect{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--dim);margin:0 0 12px}
  .bars{display:flex;flex-direction:column;gap:13px}
  .bar-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}
  .bar-name{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .bar-n{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar-track{grid-column:1/-1;height:7px;border-radius:5px;background:var(--code);overflow:hidden}
  .bar-fill{height:100%;border-radius:5px}
  .f-kritis{background:var(--f-kritis)} .f-tinggi{background:var(--f-tinggi)}
  .f-normal{background:var(--f-normal)} .f-ok{background:var(--f-ok)} .f-no{background:var(--f-kritis)}
  .pill.ok{background:var(--ok-bg);color:var(--ok-tx)}
  .pill.no{background:var(--k);color:var(--k-tx)}
  .banner{border-radius:9px;padding:12px 14px;font-size:13.5px;line-height:1.5}
  .banner.ok{background:var(--ok-bg);color:var(--ok-tx)}
  .banner.warn{background:var(--t);color:var(--t-tx)}
  .banner.no{background:var(--k);color:var(--k-tx)}
  .banner code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px;font-size:12.5px}
  .hint{font-size:12.5px;color:var(--dim);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .hint code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:7px;background:var(--code);
    border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .tok{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px}
  .tok>div{background:var(--code);border-radius:9px;padding:11px 13px}
  .tok .tn{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .tok .tl{font-size:11.5px;color:var(--dim);margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Konsol HRD</h1>
  <div class="sub">Tinjau jawaban bot sebelum dikirim, dan tangani eskalasi.</div>

  <div class="auth">
    <label for="tok" style="font-size:12px;color:var(--dim)">Token HRD</label>
    <input id="tok" type="password" placeholder="X-HRD-Token" style="flex:1;min-width:180px">
    <input id="rev" type="text" placeholder="Nama peninjau" style="min-width:150px">
    <button id="save">Simpan &amp; muat</button>
  </div>

  <nav>
    <button data-tab="drafts" class="on">Draf menunggu</button>
    <button data-tab="esc">Eskalasi</button>
    <button data-tab="stats">Statistik</button>
    <button data-tab="korpus">Dokumen</button>
  </nav>

  <div id="view"><div class="empty">Masukkan token HRD lalu klik “Simpan &amp; muat”.</div></div>
</div>

<script>
const view = document.getElementById('view');
const tokEl = document.getElementById('tok');
const revEl = document.getElementById('rev');
let tab = 'drafts';

// Token & nama peninjau disimpan lokal supaya tidak diketik ulang tiap muat.
// Ini kemudahan per-peninjau, bukan mekanisme keamanan.
try {
  tokEl.value = localStorage.getItem('hrd_tok') || '';
  revEl.value = localStorage.getItem('hrd_rev') || '';
} catch (e) {}

function hdr() {
  return { 'Content-Type': 'application/json', 'X-HRD-Token': tokEl.value };
}
function reviewer() { return revEl.value.trim() || 'hrd'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: hdr() }, opt || {}));
  if (r.status === 401) throw new Error('Token HRD tidak valid.');
  if (!r.ok) throw new Error('Gagal memuat (HTTP ' + r.status + ').');
  return r.json();
}

async function muat() {
  view.innerHTML = '<div class="empty">Memuat…</div>';
  try {
    if (tab === 'drafts') return renderDrafts(await api('/api/hrd/drafts'));
    if (tab === 'esc')    return renderEsc(await api('/api/hrd/escalations'));
    if (tab === 'stats')  return renderStats(await api('/api/hrd/stats'), await (await fetch('/healthz')).json());
    if (tab === 'korpus') return renderKorpus(await (await fetch('/healthz')).json());
  } catch (e) {
    view.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

// Waktu dari server berformat ISO UTC. Yang dibutuhkan HRD bukan stempel
// waktunya, tapi "sudah berapa lama menunggu" — itu yang menentukan urutan
// kerja. Stempel lengkapnya tetap ada di tooltip.
function waktu(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return { teks: String(iso || ''), penuh: String(iso || ''), jam: 0 };
  const menit = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000));
  const jam = menit / 60;
  let teks;
  if (menit < 1)        teks = 'baru saja';
  else if (menit < 60)  teks = menit + ' menit lalu';
  else if (jam < 24)    teks = Math.round(jam) + ' jam lalu';
  else                  teks = Math.round(jam / 24) + ' hari lalu';
  const penuh = t.toLocaleString('id-ID', {
    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
  return { teks, penuh, jam };
}

function renderDrafts(d) {
  const list = d.drafts || [];
  if (!list.length) {
    view.innerHTML = '<div class="empty">Tidak ada draf yang menunggu. 👍</div>';
    return;
  }
  view.innerHTML = `<div class="sect" style="margin:2px 0 12px">
      ${num(list.length)} draf menunggu &middot; yang paling lama menunggu di atas
    </div>` + list.map(x => {
    const w = waktu(x.created_at);
    return `
    <div class="card" data-id="${x.id}">
      <div class="q">${esc(x.question)}</div>
      <div class="a">${esc(x.draft_answer)}</div>
      <textarea data-edit="${x.id}" placeholder="Edit di sini kalau perlu. Kosongkan untuk mengirim draf apa adanya.">${esc(x.draft_answer)}</textarea>
      <div class="row">
        <button class="ok" data-act="approve" data-id="${x.id}">Setujui &amp; kirim</button>
        <button class="no" data-act="reject" data-id="${x.id}">Tolak</button>
        <span class="meta">draf #${x.id} &middot; <span title="${esc(w.penuh)}">${esc(w.teks)}</span></span>
      </div>
    </div>`;
  }).join('');
}

function renderEsc(d) {
  const list = d.escalations || [];
  if (!list.length) {
    view.innerHTML = '<div class="empty">Tidak ada eskalasi terbuka.</div>';
    return;
  }
  const kritis = list.filter(x => x.urgency === 'kritis').length;
  const kepala = kritis
    ? `<div class="banner no" style="margin-bottom:13px"><b>${num(kritis)} eskalasi kritis menunggu.</b>
       Isyarat menyakiti diri dan pelecehan ditangani hari itu juga, tidak masuk antrean biasa.</div>`
    : `<div class="sect" style="margin:2px 0 12px">
       ${num(list.length)} eskalasi terbuka &middot; urut dari yang paling mendesak</div>`;

  view.innerHTML = kepala + list.map(x => {
    const w = waktu(x.created_at);
    // Lewat sehari untuk urusan kritis/tinggi sudah bukan antrean lagi.
    const telat = w.jam >= 24 && x.urgency !== 'normal';
    return `
    <div class="card">
      <div class="bar-name">
        <span class="pill ${esc(x.urgency)}">${esc(x.urgency)}</span>
        <strong>${esc(metaKat(x.category).l)}</strong>
        <span class="meta" style="margin:0">${esc(x.category)}</span>
      </div>
      <div class="q" style="margin-top:9px">${esc(x.question)}</div>
      ${telat ? `<div class="banner warn" style="margin-top:10px">Terbuka ${esc(w.teks)} dan belum ditangani.</div>` : ''}
      <div class="row">
        <input type="text" data-note="${x.id}" placeholder="Catatan penanganan" style="flex:1;min-width:180px">
        <button data-act="handle" data-id="${x.id}">Tandai ditangani</button>
        <span class="meta">#${x.id} &middot; <span title="${esc(w.penuh)}">${esc(w.teks)}</span></span>
      </div>
    </div>`;
  }).join('');
}

// Kategori eskalasi: label manusiawi + urgensi, disamakan dengan 9 topik di
// app/guardrails.py dan URGENSI_GALAT di app/chat.py.
const KAT = {
  krisis:                { l: 'Krisis / isyarat menyakiti diri', u: 'kritis' },
  pelecehan_kekerasan:   { l: 'Pelecehan & kekerasan',           u: 'kritis' },
  phk_pesangon:          { l: 'PHK & pesangon',                  u: 'tinggi' },
  sanksi_disiplin:       { l: 'Sanksi disiplin',                 u: 'tinggi' },
  sengketa_hukum:        { l: 'Sengketa hukum',                  u: 'tinggi' },
  whistleblowing:        { l: 'Whistleblowing',                  u: 'tinggi' },
  data_orang_lain:       { l: 'Data karyawan lain',              u: 'normal' },
  konflik_personal:      { l: 'Konflik personal',                u: 'normal' },
  negosiasi_karier:      { l: 'Negosiasi karier',                u: 'normal' },
  tidak_ditemukan:       { l: 'Tidak ada di dokumen',            u: 'normal' },
  galat_rate_limited:    { l: 'Batas laju penyedia',             u: 'normal' },
  galat_auth:            { l: 'Kunci API bermasalah',            u: 'tinggi' },
  galat_model_tidak_ada: { l: 'Model tidak tersedia',            u: 'tinggi' },
  galat_konteks_penuh:   { l: 'Prompt melebihi context',         u: 'normal' },
  galat_lain:            { l: 'Gangguan penyedia',               u: 'tinggi' },
};
const STATUS_DRAF = {
  pending:  { l: 'Menunggu tinjauan', u: 'tinggi' },
  approved: { l: 'Disetujui',         u: 'ok' },
  rejected: { l: 'Ditolak',           u: 'no' },
};

function num(n) { return Number(n || 0).toLocaleString('id-ID'); }
function judulKode(k) {
  return String(k).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}
function metaKat(k)    { return KAT[k]         || { l: judulKode(k), u: 'normal' }; }
function metaStatus(k) { return STATUS_DRAF[k] || { l: judulKode(k), u: 'normal' }; }

// Batang proporsional: yang terbanyak jadi 100%, sisanya relatif terhadap itu.
function bars(obj, meta) {
  const ent = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
  if (!ent.length) return '';
  const max = Math.max(...ent.map(e => e[1]));
  return '<div class="bars">' + ent.map(([k, v]) => {
    const m = meta(k);
    const lebar = Math.max(3, Math.round(v / max * 100));
    return `<div class="bar-row">
        <div class="bar-name"><span class="pill ${m.u}">${esc(m.u)}</span>${esc(m.l)}</div>
        <div class="bar-n">${num(v)}</div>
        <div class="bar-track"><div class="bar-fill f-${m.u}" style="width:${lebar}%"></div></div>
      </div>`;
  }).join('') + '</div>';
}

function kpi(n, l, h) {
  return `<div class="kpi"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div>`
       + (h ? `<div class="h">${esc(h)}</div>` : '') + '</div>';
}

function renderStats(s, h) {
  const totalEsk = Object.values(s.eskalasi_per_kategori || {}).reduce((a, b) => a + b, 0);
  const menunggu = (s.draf_per_status || {}).pending || 0;
  const tok = s.token || {};
  // Hanya Anthropic yang melaporkan cache_read. Di penyedia lain nol itu wajar,
  // jadi peringatannya jangan ditampilkan — itu cuma derau.
  const punyaCache = h && h.provider === 'anthropic';
  const catatanCache = !punyaCache
    ? `<div class="hint">Penyedia <code>${esc(h ? h.provider : '?')}</code> tidak punya prompt caching, jadi
       <code>cache_read</code> nol itu wajar. Korpus dibaca ulang seharga penuh setiap turn.</div>`
    : (tok.cache_read > 0
        ? `<div class="banner ok"><b>Cache kena.</b> Korpus kebijakan dibaca dari cache, tidak dihitung ulang tiap turn.</div>`
        : `<div class="banner warn"><b>Cache tidak pernah kena.</b> Ada yang membatalkan prompt cache &mdash;
           biasanya timestamp atau ID yang ikut masuk prefiks prompt. Cek urutan blok di <code>app/prompts.py</code>.</div>`);

  view.innerHTML = `
    <div class="grid">
      ${kpi(num(s.total_pertanyaan), 'Pertanyaan masuk', num(s.total_sesi) + ' sesi percakapan')}
      ${kpi(s.persen_terjawab + '%', 'Terjawab bot', num(s.terjawab) + ' dari ' + num(s.total_pertanyaan))}
      ${kpi(num(s.tidak_ditemukan), 'Tidak dijawab bot', 'diblokir, dieskalasi, atau tidak ada di dokumen')}
      ${kpi(num(menunggu), 'Draf menunggu', menunggu ? 'perlu ditinjau' : 'semua bersih')}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="sect">Eskalasi per kategori &middot; ${num(totalEsk)} total</div>
      ${totalEsk
        ? bars(s.eskalasi_per_kategori, metaKat)
        : '<div class="banner ok"><b>Belum ada eskalasi.</b> Belum ada pertanyaan yang kena pagar pengaman atau gagal dijawab.</div>'}
      <div class="hint">Kategori <span class="pill kritis">kritis</span> harus ditangani hari itu juga &mdash;
      isyarat menyakiti diri dan pelecehan tidak menunggu antrean.</div>
    </div>

    <div class="card">
      <div class="sect">Draf per status</div>
      ${Object.keys(s.draf_per_status || {}).length
        ? bars(s.draf_per_status, metaStatus)
        : '<div class="banner ok"><b>Belum ada draf.</b></div>'}
      <div class="hint">Draf yang <b>ditolak</b> adalah bahan perbaikan paling berharga &mdash;
      alasan penolakan menunjukkan dokumen mana yang kurang jelas.</div>
    </div>

    <div class="card">
      <div class="sect">Token terpakai</div>
      <div class="tok">
        <div><div class="tn">${num(tok.input)}</div><div class="tl">Input</div></div>
        <div><div class="tn">${num(tok.output)}</div><div class="tl">Output</div></div>
        <div><div class="tn">${num(tok.cache_read)}</div><div class="tl">Dibaca dari cache</div></div>
      </div>
      ${catatanCache}
    </div>`;
}

function renderKorpus(h) {
  const contoh = h.dokumen_contoh || [];
  const masalah = h.masalah_korpus || [];
  view.innerHTML = `
    <div class="grid">
      ${kpi(num(h.dokumen), 'Dokumen dimuat', 'dari folder knowledge/')}
      ${kpi(num(h.perkiraan_token_korpus), 'Perkiraan token', 'dikirim setiap turn')}
      ${kpi(h.answer_mode, 'Mode jawaban', h.answer_mode === 'draft' ? 'HRD meninjau dulu' : 'langsung ke karyawan')}
      ${kpi(h.provider, 'Penyedia LLM', h.model)}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="sect">Status dokumen</div>
      ${contoh.length
        ? `<div class="banner warn">
             <div><b>${num(contoh.length)} dokumen masih contoh fiktif.</b> Selama masih ada berkas bertanda
             <code>contoh: true</code>, mode <code>auto</code> ditolak dan semua jawaban tetap ditahan sebagai
             draf &mdash; supaya aturan karangan tidak pernah terkirim ke karyawan sebagai aturan resmi.</div>
           </div>
           <div class="chips">${contoh.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>`
        : '<div class="banner ok"><b>Semua dokumen resmi.</b> Tidak ada lagi berkas bertanda <code>contoh: true</code>.</div>'}
    </div>

    <div class="card">
      <div class="sect">Masalah korpus</div>
      ${masalah.length
        ? masalah.map(m => `<div class="banner no" style="margin-bottom:8px">${esc(m)}</div>`).join('')
        : '<div class="banner ok"><b>Tidak ada masalah.</b> Front matter lengkap dan ukuran korpus masih di bawah ambang.</div>'}
      <div class="row">
        <button class="ghost" data-act="reload">Muat ulang dokumen</button>
        <span class="meta">Pakai ini setelah memperbarui file di folder knowledge/ &mdash; tanpa restart server.</span>
      </div>
    </div>`;
}

document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    tab = b.dataset.tab;
    muat();
  });
});

document.getElementById('save').addEventListener('click', () => {
  try {
    localStorage.setItem('hrd_tok', tokEl.value);
    localStorage.setItem('hrd_rev', revEl.value);
  } catch (e) {}
  muat();
});

view.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  b.disabled = true;
  try {
    if (b.dataset.act === 'approve') {
      const ta = document.querySelector(`textarea[data-edit="${id}"]`);
      const asli = document.querySelector(`.card[data-id="${id}"] .a`).textContent;
      const edited = ta.value.trim();
      await api(`/api/hrd/drafts/${id}/approve`, {
        method: 'POST',
        body: JSON.stringify({
          reviewer: reviewer(),
          final_answer: (edited && edited !== asli.trim()) ? edited : null
        })
      });
    } else if (b.dataset.act === 'reject') {
      const alasan = prompt('Kenapa jawaban ini ditolak? (jadi bahan perbaikan prompt & dokumen)');
      if (!alasan) { b.disabled = false; return; }
      await api(`/api/hrd/drafts/${id}/reject`, {
        method: 'POST',
        body: JSON.stringify({ reviewer: reviewer(), reject_reason: alasan })
      });
    } else if (b.dataset.act === 'handle') {
      const note = document.querySelector(`input[data-note="${id}"]`);
      await api(`/api/hrd/escalations/${id}/handle`, {
        method: 'POST',
        body: JSON.stringify({ handled_by: reviewer(), note: note ? note.value : null })
      });
    } else if (b.dataset.act === 'reload') {
      await api('/api/hrd/reload-knowledge', { method: 'POST' });
    }
    muat();
  } catch (e) {
    alert(e.message);
    b.disabled = false;
  }
});
</script>
</body>
</html>
